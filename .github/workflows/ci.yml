name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install cmake libclang
      - name: Locate native build tools
        shell: python
        run: |
          import os
          from pathlib import Path
          import cmake, clang
          with open(os.environ["GITHUB_ENV"], "a") as f:
              suffix = ".exe" if os.name == "nt" else ""
              f.write(f"CMAKE={Path(cmake.CMAKE_BIN_DIR) / ('cmake' + suffix)}\n")
              f.write(f"LIBCLANG_PATH={Path(clang.__file__).parent / 'native'}\n")
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo run --locked -- case 3
      - run: cargo run --locked -- solve examples/market.json chp
