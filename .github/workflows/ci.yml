name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        include:
          - python: "3.12"
            pins: numpy==1.26.0 scipy==1.12.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt ${{ matrix.pins }}
      - run: python -m pytest -q -m "not slow"
      - run: python run_market.py smoke --cfg config/ci.toml --lo 2025-10-25 --hi 2025-11-03
      - run: python -m pytest -q -m slow
      - run: python -m ruff check .
      - run: python -m pip check

  scipy-floor:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scipy: ["1.12.0", "1.13.*", "1.14.*", "1.15.*", "1.16.*", "1.17.*"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "scipy==${{ matrix.scipy }}" pytest
      - run: python -c "import scipy; print(scipy.__version__)"
      - run: python -m pytest -q tests/test_uc_price.py -k "104_feasible or compact_hull_equals_enumerated_hull_at_random"
